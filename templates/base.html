<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Hotel Paradise{% endblock %}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        :root {
        --color-morado-oscuro: #3C1361;
        --color-morado: #5A189A;
        --color-azul: #4361EE;
        --color-azul-claro: #4CC9F0;
        --color-fondo: #F4F5FF;
        --color-blanco: #FFFFFF;
        --color-texto: #1F1F2E;
    }

    body {
        background-color: var(--color-fondo);
        font-family: Arial, sans-serif;
        color: var(--color-texto);
    }

    .navbar {
        background: linear-gradient(
            90deg,
            var(--color-morado-oscuro),
            var(--color-azul)
        );
    }

    .navbar-brand {
        font-weight: bold;
        color: var(--color-blanco) !important;
    }

    .navbar .nav-link {
        color: var(--color-blanco) !important;
        transition: 0.2s ease-in-out;
    }

    .navbar .nav-link:hover {
        color: var(--color-azul-claro) !important;
    }

    .btn-primary {
        background-color: var(--color-morado);
        border-color: var(--color-morado);
    }

    .btn-primary:hover {
        background-color: var(--color-morado-oscuro);
        border-color: var(--color-morado-oscuro);
    }

    .btn-outline-primary {
        color: var(--color-azul);
        border-color: var(--color-azul);
    }

    .btn-outline-primary:hover {
        background-color: var(--color-azul);
        border-color: var(--color-azul);
        color: var(--color-blanco);
    }

    .card {
        border: none;
        border-radius: 12px;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
        background-color: var(--color-blanco);
    }

    .table thead {
        background-color: #ECE9FF;
    }

    .text-brand {
        color: var(--color-morado);
    }

    .text-brand-blue {
        color: var(--color-azul);
    }

    .badge-disponible {
        background-color: var(--color-azul);
        color: var(--color-blanco);
    }

    .badge-no-disponible {
        background-color: var(--color-morado);
        color: var(--color-blanco);
    }

    .badge-confirmada {
        background-color: var(--color-azul);
        color: var(--color-blanco);
    }

    .badge-cancelada {
        background-color: var(--color-morado);
        color: var(--color-blanco);
    }

    .badge-pendiente {
        background-color: var(--color-azul-claro);
        color: #10213A;
    }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">

            <a class="navbar-brand" href="{% url 'dashboard:inicio' %}">
                Hotel Paradise
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menuPrincipal"
                aria-controls="menuPrincipal"
                aria-expanded="false"
                aria-label="Abrir menú"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menuPrincipal">
                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'dashboard:inicio' %}">
                            Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'habitaciones:lista' %}">
                            Habitaciones
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'clientes:lista' %}">
                            Clientes
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'reservaciones:lista' %}">
                            Reservaciones
                        </a>
                    </li>


                </ul>
                {% if user.is_authenticated %}
                    <div class="d-flex align-items-center gap-3 ms-lg-4">

                        <span class="text-white small">
                            <strong>{{ user.username }}</strong>
                        </span>

                        <form method="POST" action="{% url 'usuarios:logout' %}" class="m-0">
                            {% csrf_token %}

                            <button type="submit"
                                    class="btn btn-outline-light btn-sm">
                                Cerrar sesión
                            </button>
                        </form>

                        </div>
                {% endif %}
            </div>

        </div>
    </nav>

    <main class="container py-4">

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show" role="alert">
                    {{ message }}

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="alert"
                        aria-label="Cerrar"
                    ></button>
                </div>
            {% endfor %}
        {% endif %}

        {% block content %}
        {% endblock %}

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>

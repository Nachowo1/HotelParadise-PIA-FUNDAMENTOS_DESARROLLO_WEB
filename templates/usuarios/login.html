<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión | Hotel Paradise</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
        min-height: 100vh;
        background: linear-gradient(135deg, #3C1361, #4361EE);
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .login-card {
        width: 100%;
        max-width: 420px;
        border: none;
        border-radius: 16px;
        box-shadow: 0 10px 35px rgba(0, 0, 0, 0.18);
    }

    .btn-primary {
        background-color: #5A189A;
        border-color: #5A189A;
    }

    .btn-primary:hover {
        background-color: #3C1361;
        border-color: #3C1361;
    }
    </style>
</head>

<body>
    <div class="container">
        <div class="card login-card mx-auto">
            <div class="card-body p-4 p-md-5">

                <h2 class="text-center fw-bold mb-2">
                    Hotel Paradise
                </h2>

                <p class="text-center text-muted mb-4">
                    Sistema de administración hotelera
                </p>

                {% if form.errors %}
                    <div class="alert alert-danger">
                        Usuario o contraseña incorrectos.
                    </div>
                {% endif %}

                <form method="POST">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="id_username" class="form-label">
                            Usuario
                        </label>
                        <input
                            type="text"
                            name="username"
                            id="id_username"
                            class="form-control"
                            required
                            autofocus
                        >
                    </div>

                    <div class="mb-4">
                        <label for="id_password" class="form-label">
                            Contraseña
                        </label>
                        <input
                            type="password"
                            name="password"
                            id="id_password"
                            class="form-control"
                            required
                        >
                    </div>

                    <input
                        type="hidden"
                        name="next"
                        value="{{ next }}"
                    >

                    <button type="submit"
                            class="btn btn-primary w-100 py-2">
                        Iniciar sesión
                    </button>

                </form>

            </div>
        </div>
    </div>
</body>
</html>
